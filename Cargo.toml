[package]
name = "dia"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
socket2 = { version = "0.6.4", features = ["all"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
